# type must be one of:
#   singles   = Single reviews
#   releases  = EP and album reviews
#   live      = Live and festival reviews
#   previews  = Festival and event previews
#   features  = Features and interviews
#
# favourite: true    puts it in "My favourites" at the top of the page
# editor_byline: true  adds "Written for [publication]; published under
#                      the editor's byline." under the link
# note: "..."        (optional) adds a short line under the link
# No url? Leave the url line out and it shows as plain text (e.g. print).
